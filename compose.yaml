services:
  downloader:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - downloads:/data
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
volumes:
  downloads:
